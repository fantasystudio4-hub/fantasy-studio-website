<!-- The one link to share for the app: https://www.fantasystudio.in/app
     (vercel.json rewrites /app here; /get/ works too). Each phone goes to
     its own store before anything paints: iPhone/iPad → App Store, Android →
     Google Play. A computer stays and sees both stores plus a QR code that
     opens this same link on a phone. The store app itself has nothing to
     get here, so it goes on to its own entry page.
     ?from=<source> (qr, instagram, card…) reaches Google Play as utm_source,
     so Play Console counts installs per source. ?stay keeps a phone on this
     page, to look at it or test it. Paths here are root-relative because
     the page is served at /app as well as /get/. -->
<script>
(function(){
  var html = document.documentElement, ua = navigator.userAgent;
  if(/FantasyStudioApp/.test(ua) || window.Capacitor){ location.replace('/start/'); return; }
  var APPLE = 'https://apps.apple.com/app/id6810769828';
  var PLAY = 'https://play.google.com/store/apps/details?id=in.fantasystudio.app';
  var q = null; try{ q = new URLSearchParams(location.search); }catch(e){}
  var from = String((q && q.get('from')) || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30);
  var play = from ? PLAY + '&referrer=' + encodeURIComponent('utm_source=' + from + '&utm_medium=app_link') : PLAY;
  var android = /android/i.test(ua);
  /* an iPad on iPadOS 13+ says it is a Mac, so a touch Mac is an iPad —
     unless the UA says Android (device emulators do), as on the home page */
  var ios = !android && (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  window.FS_PLAY = play;
  html.classList.add(ios ? 'is-ios' : android ? 'is-android' : 'is-desk');
  if((ios || android) && !(q && q.has('stay'))){
    html.classList.add('going');
    location.replace(ios ? APPLE : play);
  }
})();
</script>

<style>
:root{
  --gold:#B8902B; --gold-b:#E2C275; --gold-d:#8E6E1E;
  --ink:#14110a; --panel:#241e12; --line:rgba(226,194,117,.28);
  --text:#f3ecdc; --mut:#b3a98f; --cream:#f6efdf;
  --serif:'Playfair Display',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  font-family:var(--sans);color:var(--text);line-height:1.5;
  background:linear-gradient(180deg,#1a150c,#14110a 40%);
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px 28px;
}
main{width:100%;max-width:420px;text-align:center}
.logo-mark{display:block;width:76px;height:76px;margin:0 auto 1.1rem}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-b);margin-bottom:.45rem}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.65rem,6.5vw,2.25rem);line-height:1.15;color:#fff;margin-bottom:.6rem}
.lead{color:var(--mut);font-size:.98rem;margin:0 auto 1.4rem;max-width:30em}

/* a phone on its way to the store: one calm line, the button as a fallback */
.status{display:none;align-items:center;justify-content:center;gap:.6rem;color:var(--gold-b);font-size:.92rem;margin:-.4rem 0 1.1rem}
html.going .status{display:flex}
.status .to-ios,.status .to-android,.status .late{display:none}
html.is-ios .status .to-ios, html.is-android .status .to-android{display:inline}
html.late .status .to-ios, html.late .status .to-android{display:none}
html.late .status .late{display:inline}
html.late .status .spin{display:none}
.spin{flex:0 0 auto;width:18px;height:18px;border:2px solid rgba(226,194,117,.25);border-top-color:var(--gold-b);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.stores{display:flex;flex-direction:column;gap:.7rem;align-items:stretch}
.store{display:flex;align-items:center;justify-content:center;gap:.75rem;min-height:58px;padding:.55rem 1.2rem;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#C9A347,#8E6E1E);box-shadow:0 6px 16px rgba(142,110,30,.35)}
.store svg{flex:0 0 auto;width:26px;height:26px;fill:currentColor}
.store span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;font-size:1.12rem;font-weight:600;letter-spacing:.02em}
.store small{font-size:.7rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.store:active{transform:scale(.98)}
.store:focus-visible,.web:focus-visible{outline:2px solid var(--gold-b);outline-offset:3px}
@media(hover:hover){ .store:hover{filter:brightness(1.07)} }
/* a phone sees only its own store; a computer sees both */
html.is-ios .s-play, html.is-android .s-ios{display:none}

/* the computer's way onto a phone: the camera opens this same link there */
.qr{display:none;margin:1.6rem auto 0;width:max-content;max-width:100%;padding:1rem 1rem .85rem;background:var(--cream);border-radius:18px;color:var(--ink);text-align:center}
html.is-desk .qr{display:block}
.qr svg{display:block;width:200px;height:200px;margin:0 auto}
.qr path{fill:var(--ink)}
.qr figcaption{max-width:200px;margin:.6rem auto 0;font-size:.82rem;line-height:1.35;color:#4a3f27}
.qr figcaption b{display:block;font-family:var(--serif);font-size:1rem;color:var(--ink);margin-bottom:.15rem}

.web{display:inline-flex;align-items:center;min-height:44px;margin-top:1.3rem;padding:0 .6rem;color:var(--mut);font-size:.85rem;letter-spacing:.04em;text-decoration:none}
@media(hover:hover){ .web:hover{color:var(--gold-b)} }

/* a computer: words and both stores on the left, the QR code on the right */
@media (min-width:760px){
  html.is-desk main{max-width:760px;display:grid;grid-template-columns:1fr auto;column-gap:3rem;align-items:center;text-align:left}
  html.is-desk .logo-mark{margin:0 0 1.1rem}
  html.is-desk .lead{margin-left:0}
  html.is-desk .qr{grid-column:2;grid-row:1 / span 7;margin:0}
  html.is-desk .web{margin-left:-.6rem}
}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} .store:active{transform:none} }
</style>

<script>
/* the Play button carries the same ?from as the redirect, and a phone that
   is still here after a few seconds was not taken to its store (some in-app
   browsers hold it back): say so, and point at the button */
(function(){
  var html = document.documentElement, pb = document.getElementById('playBtn');
  if(pb && window.FS_PLAY) pb.href = window.FS_PLAY;
  if(html.classList.contains('going')) setTimeout(function(){
    if(document.visibilityState !== 'hidden') html.classList.add('late');
  }, 3000);
})();
</script>
