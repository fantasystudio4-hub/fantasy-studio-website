name: Deploy to GitHub Pages

# ============================================================================
# ONE-TIME SETTING REQUIRED FOR THIS WORKFLOW TO WORK:
#   Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions
#   (it was previously "Deploy from a branch: gh-pages")
# Until that is switched, the deploy-pages step below will FAIL LOUDLY rather
# than silently serve a stale site — which is the whole point of this rewrite.
# ============================================================================
#
# Why this replaced the old workflow:
# The old version force-pushed main -> gh-pages using the Actions GITHUB_TOKEN
# and relied on GitHub noticing that push and running its own "pages build and
# deployment" job. Pushes made with GITHUB_TOKEN do not reliably trigger further
# workflows, so on 26 Jul 2026 the branch was updated correctly while the CDN
# kept serving the previous build for over half an hour — including two files
# that had been deleted specifically because they should not be public.
# A branch that is right while the live site is wrong is the worst failure mode
# available, because everything looks green.
#
# This version deploys the artifact directly. There is no intermediate branch to
# drift, the deployment either happens or the run goes red, and the live URL is
# reported in the run summary.
#
# NOTE: the gh-pages branch is now vestigial. It is left in place rather than
# deleted so there is a rollback target; nothing reads from it any more.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Unlike the old config this does NOT cancel a run
# already in progress — cancelling a half-finished deploy is how you end up
# serving a partial site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The old branch-based setup got dotfile exclusion for free, because Pages
      # ran Jekyll over the branch and Jekyll skips paths beginning with "." or
      # "_". Uploading an artifact does NOT do that, so .github/ and .claude/
      # would start being served. Stage an explicit allow-list-by-exclusion
      # instead of trusting a default we no longer get.
      #
      # *.md and *.rules are excluded because they are source, not site assets.
      # lenscal/SETUP.md and lenscal/firestore.rules were both live on the public
      # domain until this change — the setup doc describes the shared-Firebase
      # architecture and which auth providers may be unconfigured, and the rules
      # file publishes the authorization model for the whole project. No visitor
      # needs either. (If a genuinely public .md page is ever wanted, carve out
      # an exception here rather than dropping the rule.)
      - name: Stage the publishable files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude '_site/' \
            --exclude '*.md' \
            --exclude '*.rules' \
            --exclude '*.rules.proposed' \
            ./ _site/
          echo "--- staged for publication ---"
          find _site -maxdepth 2 -not -path '_site' | sort

      # Belt and braces: fail the deploy if anything that must never be public
      # made it into the artifact. Cheap, and it would have caught the 26 Jul
      # exposure at the door instead of on the live domain.
      - name: Refuse to publish internal files
        run: |
          leaked=$(find _site \( \
              -iname '*AUDIT*' -o \
              -iname '*.rules.proposed' -o \
              -iname 'firestore.rules' -o \
              -iname '.env*' -o \
              -iname '*.local.*' -o \
              -name '.git' -o -name '.github' -o -name '.claude' \
            \) -print)
          if [ -n "$leaked" ]; then
            echo "::error::Refusing to deploy — these must not be public:"
            echo "$leaked"
            exit 1
          fi
          echo "No internal files in the artifact."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Prove the CDN is actually serving the new build before the run goes
      # green. The old workflow reported success while the site was stale.
      - name: Verify the live mirror serves this commit
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 20); do
            body=$(curl -fsSL "${url}?cb=$RANDOM" || true)
            if printf '%s' "$body" | grep -q 'id="quoteAnnounce"'; then
              echo "Live and serving the current build."
              exit 0
            fi
            echo "  attempt $i — not updated yet, waiting 15s"
            sleep 15
          done
          echo "::error::Deployed, but $url is still serving an old build after 5 minutes."
          exit 1
