<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Portfolio — Fantasy Studio Admin</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14110a" />
<link rel="icon" href="../../icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#14110a;--card:#1d1910;--gold:#B8902B;--gold-b:#E2C275;--paper:#f4ead2;--mut:rgba(244,234,210,.6);--line:rgba(184,144,43,.28);--ok:#7bc67e;--err:#e07a6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Jost',sans-serif;line-height:1.5;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
main{max-width:860px;margin:0 auto}
a{color:var(--gold-b)}
.top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}
.top a.back{border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;text-decoration:none;font-size:.85rem}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:#fff}
h2{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold-b);margin:1.8rem 0 .6rem}
.sub{color:var(--mut);font-size:.88rem;margin-bottom:.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.msg{padding:2rem 1rem;text-align:center;color:var(--mut)}
.btn{font:inherit;font-weight:600;background:linear-gradient(135deg,#C9A347,#8E6E1E);color:#14110a;border:0;border-radius:999px;padding:.6rem 1.2rem;cursor:pointer;min-height:44px}
.btn.ghost{background:none;color:var(--paper);border:1px solid var(--line)}
.btn.sm{padding:.35rem .8rem;min-height:36px;font-size:.82rem}
.btn.bad{color:var(--err);border-color:rgba(224,122,107,.4)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;cursor:pointer;font-size:.88rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span,.seg label:has(input:checked){background:rgba(184,144,43,.25);border-color:var(--gold)}
input[type=text]{font:inherit;background:#0f0d08;color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;min-height:44px;width:100%}
.req{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req b{display:block}.req small{color:var(--mut)}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--mut)}
.tag.ok{color:var(--ok);border-color:rgba(123,198,126,.4)}
.up{margin-top:.8rem;display:grid;gap:.5rem}
.upi{font-size:.85rem;display:grid;gap:.25rem}
.bar{height:6px;background:#0f0d08;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.it .th{aspect-ratio:4/5;background:#0f0d08 center/cover no-repeat;position:relative}
.it .th span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);border-radius:999px;padding:.05rem .55rem;font-size:.7rem}
.it .nm{padding:.45rem .6rem;font-size:.8rem;min-height:2.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .ac{display:flex;gap:.3rem;padding:0 .5rem .5rem}
.it .ac button{flex:1;font:inherit;font-size:.85rem;background:none;color:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:36px;cursor:pointer}
.it .ac .x{color:var(--err)}
.err{color:var(--err);font-size:.85rem;margin-top:.5rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><a class="back" href="../#/more">← More</a><h1>Portfolio</h1></div>
  <div id="gate" class="msg">Checking sign-in…</div>

  <div id="app" hidden>
    <p class="sub">Upload your best photos, films and reels here. Everyone you approve below sees the same portfolio.</p>

    <h2>Access requests <span class="tag" id="reqCount"></span></h2>
    <div class="card" id="reqBox"></div>

    <h2>Upload</h2>
    <div class="card">
      <div class="seg" id="kindSeg">
        <label><input type="radio" name="kind" value="photo" checked /> 📷 Photos</label>
        <label><input type="radio" name="kind" value="video" /> 🎬 Films (wide video)</label>
        <label><input type="radio" name="kind" value="reel" /> 📱 Reels (vertical video)</label>
      </div>
      <div style="margin-top:.8rem"><input type="text" id="title" maxlength="80" placeholder="Title (optional) — e.g. Ayesha &amp; Imran, Hyderabad" aria-label="Title" /></div>
      <div class="row" style="margin-top:.8rem">
        <button class="btn" id="pick" type="button">Choose files</button>
        <span class="sub" id="pickHint">Photos up to 15 MB · videos up to 500 MB</span>
      </div>
      <input type="file" id="file" multiple hidden />
      <div class="up" id="queue"></div>
      <p class="err" id="upErr" hidden></p>
    </div>

    <h2>Library <span class="tag" id="itCount"></span></h2>
    <p class="sub">Newest first. Use ↑ ↓ to change the order clients see.</p>
    <div class="grid" id="lib"></div>
  </div>
</main>
<script type="module" src="portfolio.js"></script>
</body>
</html>
